<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Borrowed IQ · Chaitanya Deshpande</title>
<style>
  :root{--radius:14px}
  *{box-sizing:border-box}
  button,select,input{font:inherit;font-size:14px;color:var(--ink)}

  /* Topics bar */
  .hdr{position:sticky;top:0;z-index:30;background:rgba(242,242,242,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin-bottom:28px}
  .hdr-in{display:flex;align-items:center;height:52px}
  .nav{display:flex;align-items:center;gap:4px}
  .nav>button{background:none;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-weight:600}
  .nav>button:first-child{margin-left:-12px}
  .nav>button:hover,.nav>button[aria-expanded=true]{background:var(--hover);color:var(--foreground)}
  .caret{width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .15s}
  button[aria-expanded=true] .caret{transform:rotate(-135deg)}
  .mega{display:none;position:absolute;left:0;right:0;top:100%;background:var(--panel);border:1px solid var(--line);border-radius:0 0 var(--radius) var(--radius);box-shadow:0 12px 30px rgba(0,0,0,.12);max-height:70vh;overflow:auto}
  .mega.open{display:block}
  .mega-in{padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
  .tile{display:flex;gap:12px;align-items:flex-start;text-align:left;background:none;border:1px solid transparent;border-radius:12px;padding:12px;cursor:pointer}
  .tile:hover,.tile.on{background:var(--bg);border-color:var(--line)}
  .tile.on{border-color:var(--primary)}
  .tile .ic{flex:none;width:38px;height:38px;border-radius:10px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:18px}
  .tile b{display:block;font-weight:600;color:var(--ink)}
  .tile em{display:block;font-style:normal;font-size:13px;color:var(--mute);margin-top:2px}

  h1{margin:0 0 10px;font-size:var(--fs-h3);font-weight:600;letter-spacing:-.03em;line-height:1.12;color:var(--ink)}
  .lede{max-width:62ch;color:var(--mute);margin:0 0 6px;font-size:16px}
  .stat{color:var(--mute);font-size:13px;margin:0 0 26px}

  .controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .controls input,.controls select,.controls button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
  .controls input{flex:1;min-width:180px}
  .controls button{cursor:pointer}
  .controls button:hover{background:var(--hover);border-color:var(--hover);color:var(--foreground)}
  .bar{display:flex;align-items:center;gap:12px;color:var(--mute);font-size:13px;margin-bottom:22px;min-height:20px}

  .sec{display:flex;align-items:center;gap:14px;margin:34px 0 4px}
  .sec:first-child{margin-top:0}
  .sec h2{margin:0;font-size:24px;font-weight:600;letter-spacing:-.02em;color:var(--pink);line-height:1.2}
  .sec i{flex:1;height:1px;background:var(--line)}
  .sec em{font-style:normal;font-size:12px;color:var(--mute);white-space:nowrap}
  .blurb{color:var(--mute);margin:0 0 4px;font-size:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:28px 22px;margin-top:18px}

  .card{display:block;text-decoration:none;color:inherit}
  a.card:hover{background:none;color:inherit}
  .thumb{aspect-ratio:16/9;border-radius:var(--radius);overflow:hidden;border:1px solid rgba(0,0,0,.12);background:var(--panel);box-shadow:0 2px 10px rgba(0,0,0,.12);transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
  .thumb img.cover{width:100%;height:100%;object-fit:cover;display:block}
  .thumb.fb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:linear-gradient(135deg,#ffffff,#e6e6e6);color:var(--mute);font-size:13px;padding:10px;text-align:center}
  .thumb.fb img{width:44px;height:44px;border-radius:10px}
  @media (hover:hover){a.card:hover .thumb{transform:translateY(-4px);box-shadow:0 10px 24px rgba(0,0,0,.2);border-color:rgba(0,0,0,.28)}}
  @media (prefers-reduced-motion:reduce){.thumb{transition:none}a.card:hover .thumb{transform:none}}
  .lab{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:12px;color:var(--mute)}
  .lab svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .lab b{font-weight:500;color:var(--ink)}
  .card h3{margin:6px 0 6px;font-size:17px;font-weight:600;letter-spacing:-.02em;line-height:1.3;overflow-wrap:anywhere}
  a.card:hover h3{text-decoration:underline;text-decoration-color:var(--hover);text-decoration-thickness:.2em;text-underline-offset:.12em}
  .note{margin:0 0 10px;font-size:14px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--mute)}
  .score{display:inline-flex;gap:4px}
  .d{width:9px;height:9px;border-radius:50%;border:1px solid var(--pink)}
  .d.on{background:var(--pink)}
  .empty{color:var(--mute);padding:50px 0;text-align:center;line-height:1.7}

  @media(max-width:760px){
    .mega-in{grid-template-columns:1fr}
  }
</style>
<link rel="stylesheet" href="site.css">
<script src="site.js" defer></script>
</head>
<body data-page="iq">
<header class="hdr">
  <div class="hdr-in">
    <nav class="nav" id="nav" aria-label="Borrowed IQ">
      <button id="topicsBtn" type="button" aria-expanded="false" aria-controls="mega">Topics <i class="caret"></i></button>
      <div class="mega" id="mega"><div class="mega-in" id="megaIn"></div></div>
      <button id="topPicks" type="button">Top picks</button>
    </nav>
  </div>
</header>

<main>
  <h1>Borrowed IQ</h1>
  <p class="lede">Articles, essays, podcasts and videos I've come across, sorted by topic. Curiosity score: 5 means I loved it and found it new and interesting.</p>
  <p class="stat" id="stat">Loading…</p>

  <div class="controls">
    <input id="q" type="search" placeholder="Search titles, sources and notes" aria-label="Search">
    <select id="type" aria-label="Content type"><option value="">Content type: All</option></select>
    <select id="score" aria-label="Curiosity score">
      <option value="">Curiosity score: All</option>
      <option value="5">5 only</option>
      <option value="4">4 and up</option>
      <option value="3">3 and up</option>
    </select>
    <button id="clear" type="button">Clear</button>
  </div>
  <div class="bar" id="bar"></div>
  <div id="out"></div>
</main>

<script>
/* ===== 1. YOUR PUBLISHED "Borrowed IQ" TAB LINK (already filled in) ===== */
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTj6KMGSl8B5QMi1alkTwjdItAjxE8g4eW3uz1emvPtv29lml0xP1Soagn45S_vYtess6o5g_fVgvJe/pub?gid=15228694&single=true&output=csv';

/* ===== 2. TOPICS: icon and one-line description (menu order follows this list) ===== */
const TOPIC_INFO = {
  'Art & Culture':             {icon:'🎨', blurb:'Art, design, music and how culture moves'},
  'Creativity & Work':         {icon:'💡', blurb:'Making things and doing work that matters'},
  'Creativity & Productivity': {icon:'💡', blurb:'Making things and doing work that matters'},
  'Curious & Fresh':           {icon:'✨', blurb:'New to me and worth a look'},
  'Writing & Education':       {icon:'✍️', blurb:'Writing well, learning and teaching'},
  'History':                   {icon:'🏛️', blurb:'Stories from the past'},
  'Life & Ideas':              {icon:'🌱', blurb:'Ways of thinking and living'},
  'Pop Culture':               {icon:'🎬', blurb:'Film, TV, music and what everyone is talking about'},
  'Science & Tech':            {icon:'🔬', blurb:'How the world and its machines work'},
  'Sports':                    {icon:'⚽', blurb:'Games, athletes and the stories around them'}
};
/* ===== EVERYTHING BELOW STAYS AS IT IS ===== */

const TYPES=['Article','Essay','Podcast','Video'];
const PLURAL={Article:'Articles',Essay:'Essays',Podcast:'Podcasts',Video:'Videos'};
const TICON={
  Article:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>',
  Essay:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16z"/></svg>',
  Podcast:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>',
  Video:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9l5 3-5 3z"/></svg>'
};
const S={topic:'',type:'',score:'',q:''};
let items=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u)?u:'';
const ytId=u=>{const m=String(u).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/);return m?m[1]:'';};
const typeOf=(t,u)=>/pod/i.test(t)?'Podcast':/vid|youtube|watch/i.test(t)?'Video':/essay/i.test(t)?'Essay':(!t&&ytId(u))?'Video':'Article';
const domain=u=>{try{return new URL(u).hostname.replace(/^www\./,'');}catch(e){return '';}};
function cacheGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function cacheSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

/* ---------- Read the Google Sheet ---------- */
function parseCSV(text){
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=c;
    } else if(c==='"') q=true;
    else if(c===','){ row.push(cur); cur=''; }
    else if(c==='\n'||c==='\r'){
      if(c==='\r'&&text[i+1]==='\n') i++;
      row.push(cur); cur='';
      if(row.some(x=>x.trim()!=='')) rows.push(row);
      row=[];
    } else cur+=c;
  }
  row.push(cur);
  if(row.some(x=>x.trim()!=='')) rows.push(row);
  return rows;
}
async function load(){
  if(CSV_URL.startsWith('PASTE')) throw new Error('no-url');
  const res=await fetch(CSV_URL+(CSV_URL.includes('?')?'&':'?')+'_='+Date.now());
  if(!res.ok) throw new Error('http '+res.status);
  const rows=parseCSV(await res.text());
  if(rows.length<2) return [];
  const head=rows[0].map(h=>h.toLowerCase().replace(/[^a-z0-9]/g,''));
  return rows.slice(1).map((r,idx)=>{
    const o={}; head.forEach((h,i)=>o[h]=(r[i]||'').trim());
    const url=safeUrl(o.url||o.link||'');
    return {
      idx, title:o.title, url, type:typeOf(o.type||'',url), cat:o.category||o.topic||'Other',
      src:o.source||o.author||'', score:Math.max(0,Math.min(5,Math.round(parseFloat(o.curiosityscore||o.score)||0))),
      note:o.note||o.notes||'', image:o.imageurl||o.image||''
    };
  }).filter(i=>i.title);
}

/* ---------- Thumbnails ---------- */
function thumb(i){
  const yt=ytId(i.url);
  const img=i.image||(yt?`https://img.youtube.com/vi/${yt}/hqdefault.jpg`:'');
  if(img) return `<div class="thumb"><img class="cover" src="${esc(img)}" alt="" loading="lazy" onerror="this.parentNode.className='thumb fb';this.outerHTML='<span>${esc(domain(i.url)||i.src)}</span>'"></div>`;
  const d=domain(i.url);
  return `<div class="thumb fb">${d?`<img src="https://www.google.com/s2/favicons?domain=${esc(d)}&sz=128" alt="">`:''}<span>${esc(i.src||d)}</span></div>`;
}
async function podArt(i){
  const term=i.src||i.title, key='pod1:'+term;
  let a=cacheGet(key);
  if(a===null){
    try{
      const d=await (await fetch('https://itunes.apple.com/search?media=podcast&entity=podcast&limit=1&term='+encodeURIComponent(term))).json();
      a=(d.results&&d.results[0]&&d.results[0].artworkUrl600)||'';
      cacheSet(key,a);
    }catch(e){a='';}
  }
  if(a) i.image=a;
}

/* ---------- Topics menu ---------- */
function topics(){
  const m={};
  items.forEach(i=>{(m[i.cat]=m[i.cat]||[]).push(i);});
  const ord=Object.keys(TOPIC_INFO), pos=n=>ord.indexOf(n)<0?999:ord.indexOf(n);
  return Object.entries(m).sort((a,b)=>pos(a[0])-pos(b[0])||b[1].length-a[1].length||a[0].localeCompare(b[0]));
}
function topicBlurb(name,list){
  const t=TOPIC_INFO[name]; if(t&&t.blurb) return t.blurb;
  const sc=list.filter(i=>i.score), avg=sc.length?(sc.reduce((s,i)=>s+i.score,0)/sc.length).toFixed(1):'–';
  return `${list.length} item${list.length>1?'s':''} · avg ${avg}`;
}
function buildMenu(){
  const tiles=topics().map(([name,list])=>{
    const t=TOPIC_INFO[name]||{};
    return `<button class="tile${S.topic===name?' on':''}" type="button" data-topic="${esc(name)}"><span class="ic">${t.icon||'✦'}</span><span><b>${esc(name)}</b><em>${esc(topicBlurb(name,list))}</em></span></button>`;
  }).join('');
  $('megaIn').innerHTML=tiles+`<button class="tile${S.topic===''?' on':''}" type="button" data-topic=""><span class="ic">→</span><span><b>Browse all</b><em>Everything, by topic</em></span></button>`;
}

/* ---------- Filters and rendering ---------- */
function visible(){
  const q=S.q.trim().toLowerCase();
  return items.filter(i=>
    (!S.topic||i.cat===S.topic)&&(!S.type||i.type===S.type)&&(!S.score||i.score>=+S.score)
    &&(!q||(i.title+' '+i.src+' '+i.note+' '+i.cat).toLowerCase().includes(q)));
}
const byScore=(a,b)=>b.score-a.score||b.idx-a.idx;

function card(i){
  const dots=[1,2,3,4,5].map(n=>`<i class="d${n<=i.score?' on':''}"></i>`).join('');
  const label=i.score?`Curiosity score ${i.score} out of 5`:'Not scored';
  const inner=`${thumb(i)}
    <div class="lab">${TICON[i.type]}<span>${i.type} in <b>${esc(i.cat)}</b></span></div>
    <h3>${esc(i.title)}</h3>
    ${i.note?`<p class="note">${esc(i.note)}</p>`:''}
    <div class="foot"><span class="score" role="img" aria-label="${label}">${dots}</span><span>${esc(i.src)}</span></div>`;
  return i.url?`<a class="card" href="${esc(i.url)}" target="_blank" rel="noopener noreferrer">${inner}</a>`:`<div class="card">${inner}</div>`;
}

function render(){
  const list=visible();
  const anyFilter=S.topic||S.type||S.score||S.q;
  $('bar').innerHTML=`<span>${list.length} of ${items.length} item${items.length===1?'':'s'}</span>`+(S.topic?`<span>· Topic: ${esc(S.topic)}</span>`:'');
  $('clear').style.visibility=anyFilter?'visible':'hidden';
  buildMenu();
  if(!list.length){ $('out').innerHTML='<div class="empty">Nothing matches. Try clearing the search or filters.</div>'; return; }

  // Always grouped by topic, highest curiosity score first within each topic
  let html='';
  topics().map(t=>t[0]).forEach(name=>{
    const g=list.filter(i=>i.cat===name).sort(byScore);
    if(!g.length) return;
    const info=TOPIC_INFO[name];
    html+=`<section><div class="sec"><h2>${info&&info.icon?info.icon+' ':''}${esc(name)}</h2><i></i><em>${g.length} item${g.length>1?'s':''}</em></div>`
      +(S.topic&&info&&info.blurb?`<p class="blurb">${esc(info.blurb)}</p>`:'')
      +`<div class="grid">${g.map(card).join('')}</div></section>`;
  });
  $('out').innerHTML=html;
}

/* ---------- State, URL and controls ---------- */
function readHash(){
  const p=new URLSearchParams(location.hash.slice(1));
  S.topic=p.get('topic')||''; S.type=p.get('type')||''; S.score=p.get('score')||''; S.q=p.get('q')||'';
}
function writeHash(){
  const p=new URLSearchParams();
  ['topic','type','score','q'].forEach(k=>{ if(S[k]) p.set(k,S[k]); });
  const h=p.toString();
  try{history.replaceState(null,'',h?'#'+h:location.pathname+location.search);}catch(e){}
}
function syncControls(){ $('q').value=S.q; $('type').value=S.type; $('score').value=S.score; }
function update(){ writeHash(); render(); }

function closeMenus(){
  $('mega').classList.remove('open'); $('topicsBtn').setAttribute('aria-expanded','false');
}
$('topicsBtn').addEventListener('click',()=>{
  const open=$('mega').classList.toggle('open');
  $('topicsBtn').setAttribute('aria-expanded',open);
});
$('megaIn').addEventListener('click',e=>{
  const b=e.target.closest('[data-topic]'); if(!b) return;
  S.topic=b.dataset.topic; syncControls(); update(); closeMenus();
  window.scrollTo({top:0,behavior:'smooth'});
});
$('topPicks').addEventListener('click',()=>{
  S.score='5'; syncControls(); update(); closeMenus();
  window.scrollTo({top:0,behavior:'smooth'});
});
document.addEventListener('click',e=>{ if(!e.target.closest('.nav')) closeMenus(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeMenus(); });
$('q').addEventListener('input',e=>{ S.q=e.target.value; update(); });
['type','score'].forEach(id=>$(id).addEventListener('input',e=>{ S[id]=e.target.value; update(); }));
$('clear').addEventListener('click',()=>{ Object.assign(S,{topic:'',type:'',score:'',q:''}); syncControls(); update(); });

/* ---------- Start ---------- */
(async function start(){
  try{
    readHash();
    items=await load();
    const present=TYPES.filter(t=>items.some(i=>i.type===t));
    $('type').innerHTML='<option value="">Content type: All</option>'+present.map(t=>`<option value="${t}">${PLURAL[t]}</option>`).join('');
    const fives=items.filter(i=>i.score===5).length;
    $('stat').textContent=`${items.length} items · ${topics().length} topics · ${fives} scored 5`;
    syncControls(); render();
    const pods=items.filter(i=>i.type==='Podcast'&&!i.image);
    for(let k=0;k<pods.length;k+=6){
      await Promise.all(pods.slice(k,k+6).map(podArt));
      render();
    }
  }catch(e){
    console.error(e);
    $('stat').textContent='';
    $('out').innerHTML=e.message==='no-url'
      ? '<div class="empty">Paste your published Borrowed IQ sheet link into CSV_URL at the top of the code.</div>'
      : '<div class="empty">Could not load the Google Sheet.<br>Check the Borrowed IQ tab is published to the web as CSV, then refresh.<br><small>('+esc(e.message)+')</small></div>';
  }
})();
</script>
</body>
</html>
